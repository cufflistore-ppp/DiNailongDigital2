  <meta property="og:image" content="/og-banner.jpg">
  <meta property="og:image:width" content="1200">

  <meta name="twitter:title" content="Nailong Digital">
  <meta name="twitter:description" content="Pusat layanan Nailong Digital. Order online, bayar QRIS atau saldo.">
  <meta name="twitter:image" content="/og-banner.jpg">

  <link rel="apple-touch-icon" href="nd-logo-gold.jpg">

</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered">
      <div class="logo-text-wrap">
        <img src="nd-logo-gold.jpg" alt="Nailong Digital" class="logo-full"></div>
    </div>
  </header>

  <div class="page-content">
    <h2 class="page-title"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</h2>
    <p class="page-desc">Hanya milik Anda — tidak dipublikasikan. Order Nokos, Suntik, Botwa, Joki, dll.</p>

    <div class="filter-tabs" id="riwayatFilter">
      <button type="button" class="filter-tab active" data-f="all">Semua</button>
      <button type="button" class="filter-tab" data-f="nokos">Nokos</button>
      <button type="button" class="filter-tab" data-f="suntik">Suntik</button>
      <button type="button" class="filter-tab" data-f="botwa">Botwa</button>
      <button type="button" class="filter-tab" data-f="lain">Lainnya</button>
    </div>

    <div id="riwayatList" class="riwayat-list">
      <div class="empty-state">
        <i class="fa-solid fa-inbox"></i>
        <p>Belum ada riwayat. Order dulu ya.</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="botwa.html" class="nav-item" data-nav="botwa">
      <span class="nav-icon-wrap"><i class="fa-brands fa-whatsapp"></i></span>
      <span>Botwa</span>
    </a>
    <a href="joki.html" class="nav-item" data-nav="joki">
      <span class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></span>
      <span>Joki Kontak</span>
    </a>
    <a href="index.html" class="nav-item active" data-nav="home">
      <span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span>
      <span>Home</span>
    </a>
    <a href="jasweb.html" class="nav-item" data-nav="jasweb">
      <span class="nav-icon-wrap"><i class="fa-solid fa-globe"></i></span>
      <span>JasWeb</span>
    </a>
    <a href="akun.html" class="nav-item" data-nav="akun">
      <span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span>
      <span>Akun</span>
    </a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="balance.js"></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="nav.js"></script>
  <script>
    function loadRiwayat() {
      var list = document.getElementById('riwayatList');
      var tx = [];
      try {
        tx = JSON.parse(localStorage.getItem('nailong_balance_tx') || '[]');
      } catch (e) {}
      if (!tx.length) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Belum ada riwayat. Order dulu ya.</p></div>';
        return;
      }
      list.innerHTML = tx.slice().reverse().map(function(t) {
        var icon = t.desc && t.desc.indexOf('Nokos') >= 0 ? 'sim-card' :
                   t.desc && t.desc.indexOf('Suntik') >= 0 ? 'bolt' :
                   t.desc && t.desc.indexOf('Botwa') >= 0 ? 'whatsapp' : 'receipt';
        var cls = t.amount < 0 ? 'debit' : 'credit';
        return '<div class="riwayat-item ' + cls + '">' +
          '<div class="riwayat-icon"><i class="fa-solid fa-' + icon + '"></i></div>' +
          '<div class="riwayat-body">' +
            '<div class="riwayat-title">' + (t.desc || 'Transaksi') + '</div>' +
            '<div class="riwayat-time">' + (t.time || '') + '</div>' +
          '</div>' +
          '<div class="riwayat-amount">' + (t.amount < 0 ? '-' : '+') + ' Rp ' + Math.abs(t.amount).toLocaleString('id-ID') + '</div>' +
        '</div>';
      }).join('');
    }
    loadRiwayat();
    document.querySelectorAll('.filter-tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        // simple filter can be added later
        loadRiwayat();
      });
    });
  </script>

  <script src="chat-system.js"></script>
  <script src="presence.js"></script>
  <script src="wijayapay.js"></script>
  <script src="pay-choice.js"></script>

  <script src="ui-enhance.js"></script>
  <script src="header-bar.js"></script>
  <script src="nailong-anim.js"></script>
</body>
</html>
