<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <style>
    .baca-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .baca-tabs button {
      border:1px solid rgba(255,193,7,0.25); background:rgba(16,24,42,0.6);
      color:#cfd8dc; border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .baca-tabs button.active { background:linear-gradient(90deg,#FFC107,#FF8F00); color:#0a0e18; border-color:transparent; }
    .baca-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .baca-card {
      background:rgba(16,24,42,0.55); border:1px solid rgba(255,193,7,0.12);
      border-radius:14px; overflow:hidden; cursor:pointer; text-decoration:none; display:block;
    }
    .baca-card img { width:100%; height:130px; object-fit:cover; display:block; background:#10182a; }
    .baca-card .info { padding:10px; }
    .baca-card h4 { margin:0 0 4px; font-size:13px; color:#fff; }
    .baca-card p { margin:0; font-size:11px; color:#8aa0b8; }
    .part-list { display:flex; flex-direction:column; gap:8px; }
    .part-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      background:rgba(16,24,42,0.55); border:1px solid rgba(255,193,7,0.12); border-radius:12px;
    }
    .part-item a { color:#FFC107; font-size:12px; font-weight:700; text-decoration:none; }
    .src-note { font-size:11px; color:#8aa0b8; margin-bottom:10px; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nd-logo-gold.jpg" alt="Nailong Digital" class="logo-full">
    </div></div>
  </header>
  <div class="page-content">
    <div class="badge">BACA & NONTON</div>
    <h2 class="page-title"><i class="fa-solid fa-book-open"></i> Komik & Anime</h2>
    <p class="page-desc">Sumber dari website eksternal (MangaDex, MAL, AniList, dll). Klik kartu untuk buka situs aslinya.</p>
    <p class="src-note"><i class="fa-solid fa-circle-info"></i> Konten milik situs sumber · Nailong hanya menautkan.</p>
    <div class="baca-tabs">
      <button type="button" class="active" data-tab="komik">Komik</button>
      <button type="button" data-tab="anime">Anime</button>
      <button type="button" data-tab="part">Part / Arc</button>
      <button type="button" data-tab="cari">Cari Lain</button>
    </div>
    <div id="bacaBox"></div>
  </div>
  <nav class="bottom-nav nav-5">

  </nav>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="header-bar.js"></script>
  <script src="nav.js"></script>
  <script src="protect.js"></script>
  <script>
    var KOMIK = [
      { t:'One Piece', d:'MangaDex · full', img:'https://cdn.myanimelist.net/images/manga/2/253146.jpg', url:'https://mangadex.org/title/a1c7c817-4e59-43b7-9365-09675a149a6f/one-piece' },
      { t:'Naruto', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/3/249658.jpg', url:'https://mangadex.org/title/6b1eb93e-473a-4ab3-9922-1a66d2672ae7/naruto' },
      { t:'Demon Slayer', d:'Kimetsu no Yaiba', img:'https://cdn.myanimelist.net/images/manga/3/179023.jpg', url:'https://mangadex.org/search?q=kimetsu%20no%20yaiba' },
      { t:'Jujutsu Kaisen', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/3/217533.jpg', url:'https://mangadex.org/title/c52b2ce3-7f95-469c-96b0-49cc2c11bc69/jujutsu-kaisen' },
      { t:'Attack on Titan', d:'Shingeki', img:'https://cdn.myanimelist.net/images/manga/2/200782l.jpg', url:'https://mangadex.org/search?q=shingeki%20no%20kyojin' },
      { t:'Spy x Family', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/3/242009l.jpg', url:'https://mangadex.org/search?q=spy%20x%20family' },
      { t:'Solo Leveling', d:'Manhwa', img:'https://cdn.myanimelist.net/images/manga/3/222295.jpg', url:'https://mangadex.org/search?q=solo%20leveling' },
      { t:'Chainsaw Man', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/3/216486.jpg', url:'https://mangadex.org/search?q=chainsaw%20man' },
      { t:'Blue Lock', d:'Soccer manga', img:'https://cdn.myanimelist.net/images/manga/5/235921.jpg', url:'https://mangadex.org/search?q=blue%20lock' },
      { t:'Tokyo Revengers', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/3/218278.jpg', url:'https://mangadex.org/search?q=tokyo%20revengers' },
      { t:'Black Clover', d:'MangaDex', img:'https://cdn.myanimelist.net/images/manga/2/157931.jpg', url:'https://mangadex.org/search?q=black%20clover' },
      { t:'My Hero Academia', d:'Boku no Hero', img:'https://cdn.myanimelist.net/images/manga/1/209370.jpg', url:'https://mangadex.org/search?q=boku%20no%20hero' }
    ];
    var ANIME = [
      { t:'One Piece', d:'MAL · ongoing', img:'https://cdn.myanimelist.net/images/anime/6/73245.jpg', url:'https://myanimelist.net/anime/21/One_Piece' },
      { t:'Jujutsu Kaisen', d:'MAL', img:'https://cdn.myanimelist.net/images/anime/1171/109222.jpg', url:'https://myanimelist.net/anime/40748/Jujutsu_Kaisen' },
      { t:'Demon Slayer', d:'Kimetsu', img:'https://cdn.myanimelist.net/images/anime/1286/99889.jpg', url:'https://myanimelist.net/anime/38000/Kimetsu_no_Yaiba' },
      { t:'Solo Leveling', d:'MAL', img:'https://cdn.myanimelist.net/images/anime/1800/140807.jpg', url:'https://myanimelist.net/anime/52299/Ore_dake_Level_Up_na_Ken' },
      { t:'Frieren', d:'Sousou no Frieren', img:'https://cdn.myanimelist.net/images/anime/1015/138006.jpg', url:'https://myanimelist.net/anime/52991/Sousou_no_Frieren' },
      { t:'Attack on Titan', d:'Final', img:'https://cdn.myanimelist.net/images/anime/10/47347.jpg', url:'https://myanimelist.net/anime/16498/Shingeki_no_Kyojin' },
      { t:'Naruto Shippuden', d:'MAL', img:'https://cdn.myanimelist.net/images/anime/5/17407.jpg', url:'https://myanimelist.net/anime/1735/Naruto__Shippuuden' },
      { t:'Hunter x Hunter', d:'2011', img:'https://cdn.myanimelist.net/images/anime/1337/99013.jpg', url:'https://myanimelist.net/anime/11061/Hunter_x_Hunter_2011' },
      { t:'Vinland Saga', d:'MAL', img:'https://cdn.myanimelist.net/images/anime/1500/109266.jpg', url:'https://myanimelist.net/anime/37521/Vinland_Saga' },
      { t:'Mob Psycho 100', d:'MAL', img:'https://cdn.myanimelist.net/images/anime/8/80356.jpg', url:'https://myanimelist.net/anime/32182/Mob_Psycho_100' }
    ];
    var PARTS = [
      { t:'One Piece — East Blue', url:'https://myanimelist.net/anime/21/One_Piece' },
      { t:'One Piece — Water 7 / Enies Lobby', url:'https://myanimelist.net/anime/21/One_Piece' },
      { t:'Naruto — Chunin Exam', url:'https://myanimelist.net/anime/20/Naruto' },
      { t:'JJK — Shibuya Incident', url:'https://myanimelist.net/anime/51009/Jujutsu_Kaisen_2nd_Season' },
      { t:'Demon Slayer — Mugen Train', url:'https://myanimelist.net/anime/40456/Kimetsu_no_Yaiba__Mugen_Ressha-hen' },
      { t:'Demon Slayer — Entertainment District', url:'https://myanimelist.net/anime/47778/Kimetsu_no_Yaiba__Yuukaku-hen' },
      { t:'AOT — Rumbling / Final', url:'https://myanimelist.net/anime/40028/Shingeki_no_Kyojin__The_Final_Season' },
      { t:'HxH — Chimera Ant', url:'https://myanimelist.net/anime/11061/Hunter_x_Hunter_2011' }
    ];
    function render(tab) {
      var box = document.getElementById('bacaBox');
      if (tab === 'cari') {
        box.innerHTML = '<div class="api-form-card"><label>Cari di MangaDex / MAL</label>'+
          '<input id="q" class="form-input" placeholder="Judul anime / komik">'+
          '<button type="button" class="btn-pesan" id="goMd" style="width:100%;margin-top:8px;">Cari MangaDex</button>'+
          '<button type="button" class="btn-topup" id="goMal" style="width:100%;margin-top:8px;">Cari MyAnimeList</button>'+
          '<button type="button" class="btn-topup" id="goAni" style="width:100%;margin-top:8px;">Cari AniList</button></div>';
        document.getElementById('goMd').onclick=function(){ window.open('https://mangadex.org/search?q='+encodeURIComponent(document.getElementById('q').value||''),'_blank'); };
        document.getElementById('goMal').onclick=function(){ window.open('https://myanimelist.net/search/all?q='+encodeURIComponent(document.getElementById('q').value||''),'_blank'); };
        document.getElementById('goAni').onclick=function(){ window.open('https://anilist.co/search/anime?search='+encodeURIComponent(document.getElementById('q').value||''),'_blank'); };
        return;
      }
      if (tab === 'part') {
        box.innerHTML = '<div class="part-list">' + PARTS.map(function(p){
          return '<div class="part-item"><i class="fa-solid fa-play" style="color:#FFC107"></i><div><b style="color:#fff;font-size:13px;">'+p.t+'</b><br><a href="'+p.url+'" target="_blank" rel="noopener">Buka di MAL</a></div></div>';
        }).join('') + '</div>';
        return;
      }
      var list = tab === 'anime' ? ANIME : KOMIK;
      box.innerHTML = '<div class="baca-grid">' + list.map(function(x){
        return '<a class="baca-card" href="'+x.url+'" target="_blank" rel="noopener"><img src="'+x.img+'" alt="" loading="lazy" onerror="this.src=\'nd-logo-gold.jpg\'"><div class="info"><h4>'+x.t+'</h4><p>'+x.d+'</p></div></a>';
      }).join('') + '</div>';
    }
    document.querySelectorAll('.baca-tabs button').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('.baca-tabs button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        render(b.getAttribute('data-tab'));
      };
    });
    render('komik');
  </script>
  <script src="ui-enhance.js"></script>
