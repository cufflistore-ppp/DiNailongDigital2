<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baca & Nonton - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>
    .baca-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .baca-tabs button {
      border:1px solid rgba(255,193,7,0.25); background:rgba(16,24,42,0.6);
      color:#cfd8dc; border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .baca-tabs button.active { background:linear-gradient(90deg,var(--nd-accent,#FFC107),var(--nd-accent-2,#FF8F00)); color:#0a0e18; border:none; }
    .baca-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .baca-card {
      background:rgba(16,24,42,0.55); border:1px solid rgba(255,193,7,0.12);
      border-radius:14px; overflow:hidden; cursor:pointer; border:none; color:inherit; text-align:left; padding:0;
    }
    .baca-card img { width:100%; height:130px; object-fit:cover; display:block; background:#10182a; }
    .baca-card .info { padding:10px; }
    .baca-card h4 { margin:0 0 4px; font-size:13px; color:#fff; }
    .baca-card p { margin:0; font-size:11px; color:#8aa0b8; }
    .reader {
      display:none; position:fixed; inset:0; z-index:120; background:#0a0e18;
      flex-direction:column;
    }
    .reader.show { display:flex; }
    .reader-bar {
      display:flex; align-items:center; gap:10px; padding:12px;
      background:#121a2b; border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .reader-bar button {
      border:none; background:rgba(255,255,255,0.08); color:#fff;
      border-radius:10px; padding:8px 12px; font-weight:700; cursor:pointer;
    }
    .reader-bar b { flex:1; color:#fff; font-size:13px; }
    .reader-body { flex:1; overflow:auto; padding:12px; -webkit-overflow-scrolling:touch; }
    .reader-body img.page {
      width:100%; max-width:520px; display:block; margin:0 auto 8px;
      border-radius:6px; background:#111;
    }
    .reader-body .vid {
      position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:12px; overflow:hidden;
    }
    .reader-body .vid iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .part-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .part-item {
      padding:12px; background:rgba(16,24,42,0.7); border-radius:12px; border:1px solid rgba(255,193,7,0.12);
      color:#fff; font-size:13px; font-weight:700; cursor:pointer; text-align:left;
    }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nailong-digital-logo.png" alt="ND" class="logo-full">
    </div></div>
  </header>
  <div class="page-content">
    <div class="badge">BACA & NONTON</div>
    <h2 class="page-title"><i class="fa-solid fa-book-open"></i> Langsung di sini</h2>
    <p class="page-desc">Komik & tontonan dibuka di dalam website (bukan lempar ke situs luar).</p>
    <div class="baca-tabs">
      <button type="button" class="active" data-tab="komik">Komik</button>
      <button type="button" data-tab="nonton">Tontonan</button>
      <button type="button" data-tab="yt">YouTube</button>
    </div>
    <div class="baca-grid" id="grid"></div>
  </div>

  <div class="reader" id="reader">
    <div class="reader-bar">
      <button type="button" id="rdClose">← Tutup</button>
      <b id="rdTitle">Reader</b>
    </div>
    <div class="reader-body" id="rdBody"></div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="baca.html" class="nav-item active"><span class="nav-icon-wrap"><i class="fa-solid fa-book"></i></span><span>Baca</span></a>
    <a href="youtube.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-brands fa-youtube"></i></span><span>YT</span></a>
    <a href="index.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span><span>Home</span></a>
    <a href="music.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-music"></i></span><span>Music</span></a>
    <a href="akun.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span><span>Akun</span></a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>
  <script src="header-bar.js"></script>
  <script src="nav.js"></script>
  <script src="ui-enhance.js"></script>
  <script>
  (function(){
    // Konten contoh di-host di sini (placeholder panel + part). Bisa diganti admin nanti.
    var KOMIK = [
      { id:'k1', title:'Petualangan Nailong', desc:'Komik pendek 5 halaman', cover:'nailong-digital-logo.png',
        pages:['nailong-digital-logo.png','logo-nd-gold.png','nailong-digital-logo.png','logo-nd-gold.png','nailong-digital-logo.png'] },
      { id:'k2', title:'Strip Santai', desc:'Episode 1', cover:'logo-nd-gold.png',
        pages:['logo-nd-gold.png','nailong-digital-logo.png','logo-nd-gold.png'] }
    ];
    var NONTON = [
      { id:'v1', title:'Cuplikan Anime (embed)', desc:'Part 1', type:'yt', vid:'jNQXAC9IVRw' },
      { id:'v2', title:'Sample Video', desc:'Part 2', type:'yt', vid:'dQw4w9WgXcQ' }
    ];
    var tab = 'komik';
    var grid = document.getElementById('grid');
    var reader = document.getElementById('reader');
    var rdBody = document.getElementById('rdBody');
    var rdTitle = document.getElementById('rdTitle');

    function render(){
      if(tab==='yt'){ location.href='youtube.html'; return; }
      var list = tab==='komik' ? KOMIK : NONTON;
      grid.innerHTML = list.map(function(item){
        var img = item.cover || ('https://i.ytimg.com/vi/'+(item.vid||'')+'/hqdefault.jpg');
        return '<button type="button" class="baca-card" data-id="'+item.id+'">'+
          '<img src="'+img+'" alt="">'+
          '<div class="info"><h4>'+item.title+'</h4><p>'+item.desc+'</p></div></button>';
      }).join('');
      grid.querySelectorAll('.baca-card').forEach(function(b){
        b.onclick = function(){ open(b.getAttribute('data-id')); };
      });
    }
    function open(id){
      var item = KOMIK.concat(NONTON).find(function(x){ return x.id===id; });
      if(!item) return;
      rdTitle.textContent = item.title;
      if(item.pages){
        rdBody.innerHTML = item.pages.map(function(src,i){
          return '<img class="page" src="'+src+'" alt="Hal '+(i+1)+'">';
        }).join('') + '<div class="part-list"><div class="part-item">Selesai · '+item.pages.length+' halaman</div></div>';
      } else if(item.vid){
        rdBody.innerHTML = '<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+item.vid+'?rel=0" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>'+
          '<div class="part-list"><div class="part-item">Part 1 · diputar di dalam website</div></div>';
      }
      reader.classList.add('show');
    }
    document.getElementById('rdClose').onclick = function(){
      reader.classList.remove('show');
      rdBody.innerHTML = '';
    };
    document.querySelectorAll('.baca-tabs button').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('.baca-tabs button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active'); tab = b.getAttribute('data-tab'); render();
      };
    });
    render();
  })();
  </script>
</body>
</html>
