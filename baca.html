<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baca & Nonton - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .baca-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .baca-tabs button {
      border:1px solid rgba(255,193,7,0.25); background:rgba(16,24,42,0.6);
      color:#cfd8dc; border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .baca-tabs button.active { background:linear-gradient(90deg,#FFC107,#FF8F00); color:#0a0e18; border-color:transparent; }
    .baca-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .baca-card {
      background:rgba(16,24,42,0.55); border:1px solid rgba(255,193,7,0.12);
      border-radius:14px; overflow:hidden; cursor:pointer;
    }
    .baca-card img { width:100%; height:120px; object-fit:cover; display:block; background:#10182a; }
    .baca-card .info { padding:10px; }
    .baca-card h4 { margin:0 0 4px; font-size:13px; color:#fff; }
    .baca-card p { margin:0; font-size:11px; color:#8aa0b8; }
    .part-list { display:flex; flex-direction:column; gap:8px; }
    .part-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      background:rgba(16,24,42,0.55); border:1px solid rgba(255,193,7,0.12); border-radius:12px;
    }
    .part-item a { color:#FFC107; font-size:12px; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nailong-digital-logo.png" alt="Nailong Digital" class="logo-full">
    </div></div>
  </header>
  <div class="page-content">
    <div class="badge">BACA & NONTON</div>
    <h2 class="page-title"><i class="fa-solid fa-book-open"></i> Komik & Anime</h2>
    <p class="page-desc">Koleksi komik lengkap & part video anime. Klik untuk buka sumber eksternal.</p>
    <div class="baca-tabs">
      <button type="button" class="active" data-tab="komik">Komik</button>
      <button type="button" data-tab="anime">Anime / Video</button>
      <button type="button" data-tab="part">Part Series</button>
    </div>
    <div id="bacaBox"></div>
  </div>
  <nav class="bottom-nav nav-5">
    <a href="botwa.html" class="nav-item" data-nav="botwa"><span class="nav-icon-wrap"><i class="fa-brands fa-whatsapp"></i></span><span>Botwa</span></a>
    <a href="joki.html" class="nav-item" data-nav="joki"><span class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></span><span>Joki Kontak</span></a>
    <a href="index.html" class="nav-item" data-nav="home"><span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span><span>Home</span></a>
    <a href="game.html" class="nav-item" data-nav="game"><span class="nav-icon-wrap"><i class="fa-solid fa-gamepad"></i></span><span>Game</span></a>
    <a href="akun.html" class="nav-item" data-nav="akun"><span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span><span>Akun</span></a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="auth-guard.js"></script>
  <script src="header-bar.js"></script>
  <script src="nav.js"></script>
  <script src="protect.js"></script>
  <script>
    var KOMIK = [
      { t:'One Piece', d:'Komik full · petualangan bajak laut', img:'https://cdn.myanimelist.net/images/manga/2/253146.jpg', url:'https://www.mangadex.org/title/a1c7c817-4e59-43b7-9365-09675a149a6f/one-piece' },
      { t:'Naruto', d:'Komik lengkap ninja', img:'https://cdn.myanimelist.net/images/manga/3/249658.jpg', url:'https://www.mangadex.org/title/6b1eb93e-473a-4ab3-9922-1a66d2672ae7/naruto' },
      { t:'Demon Slayer', d:'Kimetsu no Yaiba', img:'https://cdn.myanimelist.net/images/manga/3/179023.jpg', url:'https://www.mangadex.org/title/78964148-a4b4-4eac-a4b6-9e0c0c9a7e1a/kimetsu-no-yaiba' },
      { t:'Jujutsu Kaisen', d:'Sihir kutukan', img:'https://cdn.myanimelist.net/images/manga/3/217533.jpg', url:'https://www.mangadex.org/title/c52b2ce3-7f95-469c-96b0-49cc2c11bc69/jujutsu-kaisen' },
      { t:'Attack on Titan', d:'Shingeki no Kyojin', img:'https://cdn.myanimelist.net/images/manga/2/200782.jpg', url:'https://www.mangadex.org/search?q=attack%20on%20titan' },
      { t:'Spy x Family', d:'Aksi komedi keluarga', img:'https://cdn.myanimelist.net/images/manga/3/242009.jpg', url:'https://www.mangadex.org/search?q=spy%20x%20family' }
    ];
    var ANIME = [
      { t:'One Piece Anime', d:'Episode ongoing', img:'https://cdn.myanimelist.net/images/anime/6/73245.jpg', url:'https://myanimelist.net/anime/21/One_Piece' },
      { t:'Jujutsu Kaisen', d:'Season list', img:'https://cdn.myanimelist.net/images/anime/1171/109222.jpg', url:'https://myanimelist.net/anime/40748/Jujutsu_Kaisen' },
      { t:'Demon Slayer', d:'Full series info', img:'https://cdn.myanimelist.net/images/anime/1286/99889.jpg', url:'https://myanimelist.net/anime/38000/Kimetsu_no_Yaiba' },
      { t:'Solo Leveling', d:'Anime adaptation', img:'https://cdn.myanimelist.net/images/anime/1800/140807.jpg', url:'https://myanimelist.net/anime/52299/Ore_dake_Level_Up_na_Ken' }
    ];
    var PARTS = [
      { t:'One Piece — East Blue Arc', url:'https://myanimelist.net/anime/21/One_Piece' },
      { t:'Naruto — Chunin Exam', url:'https://myanimelist.net/anime/20/Naruto' },
      { t:'JJK — Shibuya Incident', url:'https://myanimelist.net/anime/40748/Jujutsu_Kaisen' },
      { t:'Demon Slayer — Mugen Train', url:'https://myanimelist.net/anime/40456/Kimetsu_no_Yaiba__Mugen_Ressha-hen' },
      { t:'AOT — Final Season', url:'https://myanimelist.net/anime/40028/Shingeki_no_Kyojin__The_Final_Season' }
    ];
    function render(tab) {
      var box = document.getElementById('bacaBox');
      if (tab === 'part') {
        box.innerHTML = '<div class="part-list">' + PARTS.map(function(p){
          return '<div class="part-item"><i class="fa-solid fa-play" style="color:#FFC107"></i><div><b style="color:#fff;font-size:13px;">'+p.t+'</b><br><a href="'+p.url+'" target="_blank" rel="noopener">Buka part / info</a></div></div>';
        }).join('') + '</div>';
        return;
      }
      var list = tab === 'anime' ? ANIME : KOMIK;
      box.innerHTML = '<div class="baca-grid">' + list.map(function(x){
        return '<a class="baca-card" href="'+x.url+'" target="_blank" rel="noopener"><img src="'+x.img+'" alt="" loading="lazy" onerror="this.src=\'logo.png\'"><div class="info"><h4>'+x.t+'</h4><p>'+x.d+'</p></div></a>';
      }).join('') + '</div>';
    }
    document.querySelectorAll('.baca-tabs button').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('.baca-tabs button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        render(b.getAttribute('data-tab'));
      };
    });
    render('komik');
  </script>
</body>
</html>
