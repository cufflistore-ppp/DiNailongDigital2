<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ajukan Fitur - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nd-logo-gold.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>
    .af-page { padding: 14px 14px 110px; max-width: 480px; margin: 0 auto; }
    .af-card {
      background: #FFF5E0;
      border: 2.5px solid #111;
      box-shadow: 6px 6px 0 #111;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      color: #111;
    }
    .af-card h2 { margin: 0 0 8px; font-size: 18px; font-weight: 900; color: #111; }
    .af-intro {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
      color: #111;
      margin: 0 0 14px;
      padding: 12px;
      background: #FFD600;
      border: 2.5px solid #111;
      box-shadow: 4px 4px 0 #111;
      border-radius: 14px;
    }
    label { display: block; font-size: 12px; font-weight: 800; margin: 10px 0 4px; color: #111; }
    input, textarea {
      width: 100%; box-sizing: border-box;
      padding: 11px 12px;
      border: 2.5px solid #111;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #111;
      font-weight: 700;
      color: #111;
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    .af-submit {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: #FFD600;
      border: 2.5px solid #111;
      box-shadow: 5px 5px 0 #111;
      border-radius: 14px;
      font-weight: 900;
      font-size: 15px;
      color: #111;
      cursor: pointer;
    }
    .af-submit:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #111; }
    .af-msg { margin-top: 10px; font-weight: 800; font-size: 13px; color: #111; }
    .af-list-item {
      border: 2px solid #111;
      border-radius: 12px;
      padding: 10px;
      margin: 8px 0;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .af-list-item img { max-width: 100%; border-radius: 8px; border: 2px solid #111; margin-top: 6px; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered">
      <div class="logo-text-wrap">
        <img src="nd-logo-gold.jpg" alt="ND" class="logo-full">
        <div class="nd-brand-text">NAILONG<span>DIGITAL</span></div>
      </div>
    </div>
  </header>

  <div class="af-page">
    <div class="af-card">
      <h2><i class="fa-solid fa-lightbulb"></i> Ajukan Fitur</h2>
      <div class="af-intro">
        Ajukan fitur untuk Nailong Digital, siapa tahu fitur yang kalian kasih bakalan ada di sini. Ajukan saja, ga usah malu — ajukan saja, siapa tahu ajuan kalian menarik kan bisa gw taro sini 🥰🐣
      </div>
      <form id="afForm">
        <label>Nama / panggilan (opsional)</label>
        <input id="afName" placeholder="Mis. Raffli">
        <label>Ide fitur / tulisan *</label>
        <textarea id="afText" required placeholder="Jelaskan fitur yang kamu mau..."></textarea>
        <label>Link foto / file (opsional)</label>
        <input id="afFile" type="url" placeholder="https://... (gambar / drive / dll)">
        <label>Kontak (WA / email, opsional)</label>
        <input id="afContact" placeholder="08... atau email">
        <button type="submit" class="af-submit"><i class="fa-solid fa-paper-plane"></i> Kirim ajuan</button>
        <p class="af-msg" id="afMsg"></p>
      </form>
    </div>
    <div class="af-card">
      <h2 style="font-size:15px">Ajuan terbaru (lokal + cloud)</h2>
      <div id="afList"><p style="font-weight:700;font-size:12px;color:#555">Belum ada / memuat...</p></div>
    </div>
  </div>

  <nav class="bottom-nav nav-5"></nav>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="header-bar.js"></script>
  <script>
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}); }
  async function loadList(){
    var el = document.getElementById('afList');
    var rows = [];
    try {
      if (typeof firebase !== 'undefined' && firebase.apps.length) {
        var snap = await firebase.database().ref('nd_feature_requests').limitToLast(30).once('value');
        var v = snap.val() || {};
        rows = Object.keys(v).map(function(k){ return v[k]; });
      }
    } catch(e) {}
    try {
      var local = JSON.parse(localStorage.getItem('nd_feature_requests') || '[]');
      rows = rows.concat(local);
    } catch(e) {}
    rows.sort(function(a,b){ return (b.at||0)-(a.at||0); });
    // unique by id
    var seen = {}, uniq = [];
    rows.forEach(function(r){ var id=r.id||r.at; if(seen[id])return; seen[id]=1; uniq.push(r); });
    if (!uniq.length) { el.innerHTML = '<p style="font-weight:700;font-size:12px;color:#555">Belum ada ajuan. Jadilah yang pertama 🐣</p>'; return; }
    el.innerHTML = uniq.slice(0,20).map(function(r){
      return '<div class="af-list-item"><b>'+esc(r.name||'Anonim')+'</b> · <span style="color:#555">'+new Date(r.at||Date.now()).toLocaleString('id-ID')+'</span><div style="margin-top:4px">'+esc(r.text)+'</div>'+
        (r.file ? (/\.(png|jpe?g|gif|webp)(\?|$)/i.test(r.file) ? '<img src="'+esc(r.file)+'" alt="">' : '<div><a href="'+esc(r.file)+'" target="_blank" rel="noopener">File / link</a></div>') : '')+
        (r.contact ? '<div style="margin-top:4px;color:#555">Kontak: '+esc(r.contact)+'</div>' : '')+
      '</div>';
    }).join('');
  }
  document.getElementById('afForm').onsubmit = async function(e){
    e.preventDefault();
    var msg = document.getElementById('afMsg');
    var text = document.getElementById('afText').value.trim();
    if (!text) { msg.textContent = 'Tulis ide fiturnya dulu.'; return; }
    var row = {
      id: 'af_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name: document.getElementById('afName').value.trim() || 'Anonim',
      text: text,
      file: document.getElementById('afFile').value.trim(),
      contact: document.getElementById('afContact').value.trim(),
      at: Date.now()
    };
    try {
      var user = null;
      try { user = firebase.auth().currentUser; } catch(e){}
      if (user) { row.uid = user.uid; row.email = user.email || ''; }
      if (typeof firebase !== 'undefined' && firebase.database) {
        await firebase.database().ref('nd_feature_requests/' + row.id).set(row);
      }
      var local = JSON.parse(localStorage.getItem('nd_feature_requests') || '[]');
      local.unshift(row);
      localStorage.setItem('nd_feature_requests', JSON.stringify(local.slice(0,50)));
      msg.textContent = 'Makasih! Ajuan kamu sudah terkirim 🐣';
      document.getElementById('afForm').reset();
      loadList();
    } catch (err) {
      // fallback local only
      try {
        var local2 = JSON.parse(localStorage.getItem('nd_feature_requests') || '[]');
        local2.unshift(row);
        localStorage.setItem('nd_feature_requests', JSON.stringify(local2.slice(0,50)));
        msg.textContent = 'Tersimpan di perangkat (cloud offline). Makasih 🐣';
        loadList();
      } catch(e2) {
        msg.textContent = 'Gagal: ' + (err.message || err);
      }
    }
  };
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(loadList, 400); });
  </script>
<div class="version-footer">v2.0.0</div>
<script src="nav.js"></script>
</body>
</html>
