<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tools · Siputzx API - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nd-logo-gold.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>
    .sx-page { padding: 12px 14px 120px; max-width: 520px; margin: 0 auto; }
    .sx-back-top {
      width: 42px; height: 42px; border: 2.5px solid #111; border-radius: 12px;
      background: #FFF5E0; box-shadow: 3px 3px 0 #111; display: inline-flex;
      align-items: center; justify-content: center; text-decoration: none; margin-bottom: 10px;
    }
    .sx-back-top i { color: #111 !important; }
    .sx-banner {
      background: #FFD600; border: 2.5px solid #111; box-shadow: 5px 5px 0 #111;
      border-radius: 14px; padding: 12px; margin-bottom: 12px; font-size: 12px; font-weight: 700; color: #111;
    }
    .sx-banner a { color: #111; font-weight: 900; word-break: break-all; }
    #sxSearch {
      width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 12px;
      border: 2.5px solid #111; border-radius: 14px; box-shadow: 4px 4px 0 #111;
      font-weight: 700; background: #FFF5E0; color: #111;
    }
    .sx-status { font-size: 11px; font-weight: 800; color: #555; margin-bottom: 10px; }
    .sx-cat {
      font-size: 13px; font-weight: 900; color: #111; margin: 14px 0 8px;
    }
    .sx-cat small { color: #555; font-weight: 700; }
    .sx-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .sx-card {
      background: #FFF5E0; border: 2.5px solid #111; box-shadow: 5px 5px 0 #111;
      border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer;
      font-weight: 800; font-size: 11px; color: #111; display: flex; flex-direction: column;
      align-items: center; gap: 6px;
    }
    .sx-card i { font-size: 18px; color: #111 !important; }
    .sx-card:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #111; }
    #sxPanel {
      display: none; margin-top: 12px;
      background: #FFF5E0; border: 2.5px solid #111; box-shadow: 6px 6px 0 #111;
      border-radius: 16px; padding: 14px;
    }
    #sxPanel.active { display: block; }
    .sx-tool-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .sx-tool-head b { font-size: 15px; color: #111; text-transform: capitalize; }
    .sx-path { font-size: 10px; color: #555; font-weight: 700; word-break: break-all; }
    .sx-back {
      width: 40px; height: 40px; flex-shrink: 0; border: 2.5px solid #111; border-radius: 12px;
      background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .sx-sum { font-size: 12px; font-weight: 700; color: #555; margin: 0 0 10px; }
    .sx-form label { display: block; font-size: 12px; font-weight: 800; color: #111; margin: 8px 0 4px; }
    .sx-form input, .sx-form textarea {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 2.5px solid #111; border-radius: 12px; box-shadow: 3px 3px 0 #111;
      font-weight: 700; color: #111; background: #fff;
    }
    .sx-run {
      width: 100%; margin-top: 12px; padding: 14px; background: #FFD600;
      border: 2.5px solid #111; box-shadow: 5px 5px 0 #111; border-radius: 14px;
      font-weight: 900; font-size: 14px; color: #111; cursor: pointer;
    }
    .sx-run:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #111; }
    .sx-run:disabled { opacity: 0.7; }
    .sx-out { margin-top: 14px; }
    .sx-img {
      width: 100%; border: 2.5px solid #111; border-radius: 12px; box-shadow: 4px 4px 0 #111;
      background: #fff; display: block;
    }
    .sx-media { width: 100%; margin-top: 8px; }
    .sx-dl {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 10px 14px;
      background: #fff; border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; border-radius: 12px;
      font-weight: 900; color: #111; text-decoration: none; font-size: 13px;
    }
    .sx-json {
      background: #111; color: #FFD600; padding: 12px; border-radius: 12px;
      font-size: 11px; overflow: auto; max-height: 320px; margin-top: 10px;
      border: 2.5px solid #111;
    }
    .sx-err {
      background: #ffcdd2; border: 2.5px solid #111; box-shadow: 3px 3px 0 #111;
      border-radius: 12px; padding: 12px; font-weight: 800; color: #111; font-size: 13px;
    }
    .sx-loading { font-weight: 800; color: #111; font-size: 13px; }
    .sx-empty { font-weight: 800; color: #555; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered">
      <div class="logo-text-wrap">
        <img src="nd-logo-gold.jpg" alt="ND" class="logo-full">
        <div class="nd-brand-text">NAILONG<span>DIGITAL</span></div>
      </div>
    </div>
  </header>

  <div class="sx-page">
    <a href="index.html" class="sx-back-top" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></a>
    <h2 class="page-title"><i class="fa-solid fa-screwdriver-wrench"></i> Tools</h2>
    <p class="page-desc">Semua endpoint dari API Siputzx — Brat, canvas, AI, downloader, search, dll.</p>

    <div class="sx-banner">
      Sumber API: <a href="https://app.siputzx.my.id/playground" target="_blank" rel="noopener">app.siputzx.my.id/playground</a><br>
      Base: <a href="https://api.siputzx.my.id" target="_blank" rel="noopener">api.siputzx.my.id</a>
    </div>

    <input type="search" id="sxSearch" placeholder="Cari: brat, tiktok, canvas, ai…" autocomplete="off">
    <div class="sx-status" id="sxStatus">Memuat…</div>
    <div id="sxGrid"></div>

    <div id="sxPanel">
      <div id="sxArea"></div>
    </div>
  </div>

  <nav class="bottom-nav nav-5"></nav>
  <script src="nav.js"></script>
  <script src="header-bar.js"></script>
  <script src="tools-siputzx.js"></script>
  <script src="ui-enhance.js"></script>
</body>
</html>
