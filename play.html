<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nd-logo-gold.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>
    html, body.play-full {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0 !important;
      background: #FFD600 !important;
      background-image: linear-gradient(160deg, #FFD600 0%, #FFC107 40%, #FF8C00 100%) !important;
    }
    body.play-full .bottom-nav,
    body.play-full .neo-top-actions,
    body.play-full .float-sticker {
      display: none !important;
    }
    .play-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 20;
      background: linear-gradient(160deg, #FFD600 0%, #FFC107 40%, #FF8C00 100%);
    }
    .play-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #FFF5E0;
      border-bottom: 2.5px solid #111;
      box-shadow: 0 4px 0 #111;
      flex-shrink: 0;
    }
    .play-back {
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 2.5px solid #111;
      background: #fff;
      box-shadow: 3px 3px 0 #111;
      font-size: 18px;
      color: #111;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .play-back:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }
    .play-title {
      flex: 1;
      font-weight: 900;
      font-size: 15px;
      color: #111;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .play-stage {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 24px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .play-stage .game-cv {
      width: 100% !important;
      max-width: 100%;
      height: auto !important;
      border: 2.5px solid #111 !important;
      box-shadow: 5px 5px 0 #111 !important;
      border-radius: 12px;
      background: #70c5ce;
    }
    /* Back menu modal */
    .play-menu-ov {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .play-menu-ov.show { display: flex; }
    .play-menu {
      width: 100%; max-width: 420px;
      background: #FFF5E0;
      border: 2.5px solid #111;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -6px 0 #111;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    }
    .play-menu h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 900;
      color: #111;
      text-align: center;
    }
    .play-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0 0 10px;
      padding: 14px 16px;
      border: 2.5px solid #111;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #111;
      background: #fff;
      font-weight: 900;
      font-size: 14px;
      color: #111;
      cursor: pointer;
      text-align: left;
    }
    .play-menu button.accent { background: #FFD600; }
    .play-menu button.danger { background: #ffcdd2; }
    .play-menu button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #111; }
    .play-menu button i { width: 22px; color: #111 !important; }

    /* Remote controls for bird */
    .bird-remote {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      justify-content: center;
    }
    .bird-pad {
      flex: 1;
      max-width: 160px;
      padding: 18px 12px;
      border: 2.5px solid #111;
      border-radius: 16px;
      background: #FFD600;
      box-shadow: 5px 5px 0 #111;
      font-weight: 900;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .bird-pad i { font-size: 22px; color: #111 !important; }
    .bird-pad:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 #111;
      background: #FF8C00;
    }
  </style>
</head>
<body class="play-full nd-neo nd-light">
  <div class="play-shell">
    <div class="play-bar">
      <button type="button" class="play-back" id="btnPlayBack" aria-label="Kembali">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="play-title" id="gameTitle">Game</div>
    </div>
    <div class="play-stage" id="gameArea"></div>
  </div>

  <div class="play-menu-ov" id="playMenu">
    <div class="play-menu">
      <h3>Menu game</h3>
      <button type="button" class="accent" id="menuContinue"><i class="fa-solid fa-play"></i> Lanjut main</button>
      <button type="button" id="menuOther"><i class="fa-solid fa-gamepad"></i> Pilih game lain</button>
      <button type="button" class="danger" id="menuExit"><i class="fa-solid fa-house"></i> Keluar ke beranda</button>
    </div>
  </div>

  <script src="games-catalog.js"></script>
  <script src="games-app.js"></script>
  <script src="protect.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    var cat = (window.NAILONG_GAMES_CATALOG || []).find(function (g) { return g.key === id; });
    var title = cat ? cat.name : (id || 'Game');
    document.getElementById('gameTitle').textContent = title;
    document.title = title + ' - Nailong Digital';

    if (window.NailongGames && typeof NailongGames.start === 'function') {
      NailongGames.start(id, cat);
    } else {
      document.getElementById('gameArea').innerHTML =
        '<div style="padding:20px;text-align:center;font-weight:800;color:#111">Engine belum load</div>';
    }

    var menu = document.getElementById('playMenu');
    document.getElementById('btnPlayBack').onclick = function () {
      menu.classList.add('show');
    };
    document.getElementById('menuContinue').onclick = function () {
      menu.classList.remove('show');
    };
    document.getElementById('menuOther').onclick = function () {
      location.href = 'game.html';
    };
    document.getElementById('menuExit').onclick = function () {
      location.href = 'index.html';
    };
    menu.addEventListener('click', function (e) {
      if (e.target === menu) menu.classList.remove('show');
    });
  });
  </script>
<script src="nav.js"></script>
</body>
</html>
