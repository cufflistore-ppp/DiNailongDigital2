<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f0f0f !important; color: #fff; }
    .yt-top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: #0f0f0f;
      border-bottom: 1px solid #272727;
    }
    .yt-logo { display:flex; align-items:center; gap:6px; font-weight:800; font-size:18px; color:#fff; text-decoration:none; white-space:nowrap; }
    .yt-logo i { color: #f00; font-size: 22px; }
    .yt-search {
      flex: 1; display: flex; max-width: 640px; margin: 0 auto;
    }
    .yt-search input {
      flex: 1; background: #121212; border: 1px solid #303030; border-right: none;
      border-radius: 40px 0 0 40px; padding: 10px 16px; color: #fff; font-size: 14px;
    }
    .yt-search button {
      background: #222; border: 1px solid #303030; border-radius: 0 40px 40px 0;
      padding: 0 18px; color: #fff; cursor: pointer;
    }
    .yt-chips { display:flex; gap:8px; overflow-x:auto; padding: 10px 12px; scrollbar-width:none; }
    .yt-chips::-webkit-scrollbar { display:none; }
    .yt-chips button {
      flex-shrink:0; border:none; border-radius:8px; padding:7px 12px;
      background: #272727; color:#fff; font-size:12px; font-weight:600; cursor:pointer;
    }
    .yt-chips button.active { background:#fff; color:#0f0f0f; }
    .yt-grid {
      display: grid; grid-template-columns: 1fr; gap: 18px;
      padding: 8px 12px 110px;
    }
    @media(min-width:600px){ .yt-grid { grid-template-columns: 1fr 1fr; } }
    .yt-card { cursor: pointer; }
    .yt-thumb {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #222; border-radius: 12px; overflow: hidden;
    }
    .yt-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .yt-meta { display:flex; gap:10px; margin-top:10px; }
    .yt-avatar {
      width:36px; height:36px; border-radius:50%; background:#333; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#aaa;
    }
    .yt-meta b { display:block; font-size:14px; line-height:1.3; color:#f1f1f1; font-weight:600; }
    .yt-meta span { font-size:12px; color:#aaa; }
    .yt-player-wrap {
      display:none; position:fixed; inset:0; z-index:50; background:#000;
      flex-direction: column;
    }
    .yt-player-wrap.open { display:flex; }
    .yt-player-wrap iframe { flex:1; width:100%; border:none; }
    .yt-player-bar {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      background:#212121; color:#fff;
    }
    .yt-player-bar button { border:none; background:transparent; color:#fff; font-size:20px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="yt-top">
    <a class="yt-logo" href="index.html"><i class="fa-brands fa-youtube"></i> YouTube</a>
    <form class="yt-search" id="ytForm">
      <input type="search" id="ytQ" placeholder="Cari" autocomplete="off">
      <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
  </div>
  <div class="yt-chips" id="chips">
    <button type="button" class="active" data-q="trending">Semua</button>
    <button type="button" data-q="music">Musik</button>
    <button type="button" data-q="gaming">Game</button>
    <button type="button" data-q="anime">Anime</button>
    <button type="button" data-q="news indonesia">Berita</button>
    <button type="button" data-q="tutorial">Tutorial</button>
    <button type="button" data-q="comedy">Komedi</button>
    <button type="button" data-q="olahraga">Olahraga</button>
  </div>
  <div class="yt-grid" id="grid"><p style="color:#aaa;padding:20px;">Memuat…</p></div>

  <div class="yt-player-wrap" id="playerWrap">
    <div class="yt-player-bar">
      <button type="button" id="ytClose"><i class="fa-solid fa-arrow-left"></i></button>
      <b id="ytTitle" style="flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></b>
    </div>
    <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="baca.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-book"></i></span><span>Baca</span></a>
    <a href="music.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-music"></i></span><span>Music</span></a>
    <a href="index.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span><span>Home</span></a>
    <a href="youtube.html" class="nav-item active"><span class="nav-icon-wrap"><i class="fa-brands fa-youtube"></i></span><span>YouTube</span></a>
    <a href="tools.html" class="nav-item"><span class="nav-icon-wrap"><i class="fa-solid fa-screwdriver-wrench"></i></span><span>Tools</span></a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>
  <script src="header-bar.js"></script>
  <script src="nav.js"></script>
  <script src="ui-enhance.js"></script>
  <script>
  (function(){
    var grid = document.getElementById('grid');
    function card(v){
      var id = v.id.videoId || v.id;
      var sn = v.snippet || {};
      var thumb = (sn.thumbnails && (sn.thumbnails.medium||sn.thumbnails.default||{}).url) || ('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg');
      var title = sn.title || 'Video';
      var ch = sn.channelTitle || '';
      return '<div class="yt-card" data-id="'+id+'" data-title="'+title.replace(/"/g,'&quot;')+'">'+
        '<div class="yt-thumb"><img src="'+thumb+'" alt="" loading="lazy"></div>'+
        '<div class="yt-meta"><div class="yt-avatar">'+(ch.charAt(0)||'Y')+'</div><div><b>'+title+'</b><span>'+ch+'</span></div></div></div>';
    }
    async function search(q){
      grid.innerHTML = '<p style="color:#aaa;padding:20px;">Mencari…</p>';
      // YouTube oEmbed / no-key: use Invidious-like public search mirrors or Google without API key via rss
      // Practical: use YouTube search page scrape alternative - piped / invidious API
      var endpoints = [
        'https://piped.video/api/v1/search?q='+encodeURIComponent(q)+'&filter=videos',
        'https://invidious.nerdvpn.de/api/v1/search?q='+encodeURIComponent(q)+'&type=video'
      ];
      var items = [];
      for (var i=0;i<endpoints.length;i++){
        try {
          var r = await fetch(endpoints[i]);
          if (!r.ok) continue;
          var j = await r.json();
          if (Array.isArray(j)) items = j;
          else if (j.items) items = j.items;
          if (items.length) break;
        } catch(e){}
      }
      if (!items.length) {
        // fallback popular static embeds ids
        grid.innerHTML = '<p style="color:#aaa;padding:12px;">Pencarian publik sibuk. Coba kata lain atau buka langsung YouTube.</p>'+
          ['dQw4w9WgXcQ','jNQXAC9IVRw','9bZkp7q19f0'].map(function(id){
            return card({ id:{videoId:id}, snippet:{ title:'Video', channelTitle:'YouTube', thumbnails:{ medium:{ url:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'}}}});
          }).join('');
      } else {
        grid.innerHTML = items.slice(0,24).map(function(v){
          var id = v.videoId || v.id || (v.url && v.url.replace('https://www.youtube.com/watch?v=',''));
          return card({
            id: { videoId: id },
            snippet: {
              title: v.title || 'Video',
              channelTitle: v.uploaderName || v.author || v.owner || '',
              thumbnails: { medium: { url: (v.thumbnail || (v.videoThumbnails && v.videoThumbnails[0] && v.videoThumbnails[0].url) || ('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg')) } }
            }
          });
        }).join('');
      }
      grid.querySelectorAll('.yt-card').forEach(function(el){
        el.onclick = function(){
          var id = el.getAttribute('data-id');
          document.getElementById('ytTitle').textContent = el.getAttribute('data-title')||'';
          document.getElementById('ytFrame').src = 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1';
          document.getElementById('playerWrap').classList.add('open');
        };
      });
    }
    document.getElementById('ytForm').onsubmit = function(e){
      e.preventDefault();
      var q = document.getElementById('ytQ').value.trim() || 'trending';
      search(q);
    };
    document.getElementById('chips').querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        document.getElementById('chips').querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        search(b.getAttribute('data-q'));
      };
    });
    document.getElementById('ytClose').onclick = function(){
      document.getElementById('playerWrap').classList.remove('open');
      document.getElementById('ytFrame').src = '';
    };
    search('music indonesia');
  })();
  </script>
</body>
</html>
