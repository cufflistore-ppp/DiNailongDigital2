  <script>
    function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id") || "1", 10);
      
      // pastikan paket sudah load
      if (typeof loadPaketFromStorage === "function") loadPaketFromStorage();
      
      const paket = (typeof paketJoki !== "undefined") 
        ? paketJoki.find(p => p.id === id) 
        : null;

      const el = document.getElementById("detailPaket");
      if (!paket) {
        el.innerHTML = "<p style='color:#aaa;'>Paket tidak ditemukan. <a href='joki.html' style='color:#FFC107;'>Kembali</a></p>";
        return;
      }

      const formatRp = (n) => "Rp " + Number(n).toLocaleString("id-ID");

      el.innerHTML = `
        <div class="order-header" style="margin-bottom:16px;">
          <img src="nd-logo-gold.jpg" class="order-logo" alt="Nailong">
          <div>
            <h3>${paket.judul}</h3>
            <p>Nailong · <span class="tag">${paket.label || "Joki"}</span> · <span class="tag aman">Aman</span></p>
          </div>
        </div>

        <div class="badge">JASA JOKI KONTAK</div>

        <div class="paket-card" style="margin-top:12px;">
          <div class="paket-label">${paket.label}</div>
          <h3 style="font-size:20px;">${paket.judul}</h3>
          <p>${paket.deskripsi}</p>
          <ul style="margin:14px 0;">
            ${paket.fitur.map(f => `<li> ${f}</li>`).join("")}
          </ul>
          <div class="harga" style="font-size:26px;">${formatRp(paket.harga)}</div>
          <a href="pesan.html?id=${paket.id}" class="btn-pesan" style="display:block;text-align:center;text-decoration:none;margin-top:12px;">
            Pesan Sekarang
          </a>
        </div>

        <div class="info-box" style="margin:16px 0 0;">
          <h4>Cara order</h4>
          <p>1. Klik <b>Pesan Sekarang</b><br>
          2. Isi teks joki (ganti NAMA STORE & nomor WA di format)<br>
          3. Bayar via QRIS<br>
          4. Konfirmasi pembayaran<br>
          5. Pantau status di Antrian</p>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(loadDetail, 50);
    });
  </script>
