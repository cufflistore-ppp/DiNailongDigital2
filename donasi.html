<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered">
      <div class="logo-text-wrap">
        <img src="nailong-digital-logo.png" alt="Nailong Digital" class="logo-full"></div>
    </div>
  </header>

  <div class="page-content">
    <div class="badge">SUPPORT</div>
    <h2 class="page-title"><i class="fa-solid fa-hand-holding-heart"></i> Donasi</h2>
    <p class="page-desc">Dukung Nailong Digital biar tetap jalan. Scan QR di bawah (QR pribadi owner, bukan gateway).</p>

    <div class="pay-card" style="text-align:center;">
      <!-- Ganti src jadi file QR asli kamu, misal: donasi-qr.png -->
      <img src="donasi-qr.png" alt="QR Donasi"
           style="width:100%;max-width:280px;border-radius:14px;background:#fff;padding:12px;"
           onerror="this.style.display='none';document.getElementById('donasiFallback').style.display='block';">
      <div id="donasiFallback" style="display:none;padding:40px 16px;color:#8aa0b8;font-size:13px;">
        <i class="fa-solid fa-qrcode" style="font-size:48px;color:#FFC107;display:block;margin-bottom:12px;"></i>
        Upload file <b style="color:#FFC107">donasi-qr.png</b> ke folder website<br>
        (QR asli kamu, bukan WijayaPay)
      </div>
      <p style="margin-top:14px;font-size:13px;color:#aaa;">Terima kasih atas dukungannya 🙏</p>
      <a href="https://wa.me/6285124697215?text=Halo%20admin%2C%20saya%20sudah%20donasi" target="_blank" rel="noopener"
         class="btn-pesan" style="margin-top:12px;display:inline-flex;align-items:center;gap:8px;">
        <i class="fa-brands fa-whatsapp"></i> Konfirmasi via WA
      </a>
    </div>
  </div>
