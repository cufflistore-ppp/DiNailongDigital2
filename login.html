<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0e18 !important; }
    .auth-wrap { max-width: 400px; margin: 0 auto; padding: 24px 16px 100px; }
    .auth-card {
      background: rgba(16,24,42,0.82); border: 1px solid rgba(255,193,7,0.22);
      border-radius: 20px; padding: 28px 20px; text-align: center;
      backdrop-filter: blur(12px);
    }
    .auth-card img.logo {
      width: 88px; height: auto; margin: 0 auto 14px; display: block;
      background: transparent !important; border-radius: 0;
      object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
    }
    .auth-card h1 { font-size: 20px; color: #fff; margin: 0 0 6px; }
    .auth-card .sub { font-size: 13px; color: #8aa0b8; margin-bottom: 20px; }
    .auth-card label { display:block; text-align:left; font-size:12px; color:#cfd8dc; margin: 10px 0 4px; font-weight:600; }
    .auth-card .form-input { width:100%; background:#0d1220 !important; color:#fff !important; }
    .btn-auth {
      width: 100%; margin-top: 14px; padding: 14px;
      background: linear-gradient(90deg,#FFC107,#FF8F00); color:#0a0e18;
      border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .btn-google {
      width: 100%; margin-top: 10px; padding: 13px;
      background: #fff; color: #1a1a1a; border: none; border-radius: 12px;
      font-weight: 700; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .auth-links { margin-top: 16px; font-size: 13px; color: #8aa0b8; }
    .auth-links a { color: #FFC107; font-weight: 700; text-decoration: none; }
    .divider { display:flex; align-items:center; gap:10px; margin: 16px 0; color:#6b7a90; font-size:11px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,193,7,0.2); }
    .auth-err { color:#ff8a80; font-size:12px; margin-top:10px; min-height:18px; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nailong-digital-logo.png" alt="Nailong Digital" class="logo-full" style="background:transparent">
    </div></div>
  </header>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="nailong-digital-logo.png" alt="ND" class="logo">
      <h1>Masuk</h1>
      <p class="sub">Login ke Nailong Digital untuk order &amp; fitur lengkap.</p>
      <label>Email</label>
      <input type="email" id="email" class="form-input" placeholder="email@contoh.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="pass" class="form-input" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="btn-auth" id="btnLogin">Masuk</button>
      <div class="divider">atau</div>
      <button type="button" class="btn-google" id="btnGoogle"><i class="fa-brands fa-google" style="color:#ea4335"></i> Lanjut dengan Google</button>
      <div class="auth-err" id="err"></div>
      <div class="auth-links">Belum punya akun? <a href="register.html">Daftar</a></div>
      <div class="auth-links"><a href="index.html">← Kembali ke beranda</a></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="auth.js"></script>
  <script src="ui-enhance.js"></script>
  <script>
  (function () {
    function showErr(m) { document.getElementById('err').textContent = m || ''; }
    function ensureFb() {
      if (typeof firebase === 'undefined') throw new Error('Firebase SDK belum load');
      if (!firebase.apps.length) {
        var cfg = (window.VoxyyOrders && window.VoxyyOrders.FIREBASE_CONFIG) || null;
        if (!cfg) throw new Error('Config Firebase tidak ada');
        firebase.initializeApp(cfg);
      }
      try {
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      } catch (e) {}
      return firebase.auth();
    }
    try { ensureFb(); } catch (e) { showErr(e.message); }

    document.getElementById('btnGoogle').onclick = async function () {
      showErr('');
      try {
        ensureFb();
        if (!window.VoxyyAuth) throw new Error('Auth belum siap');
        var u = await VoxyyAuth.loginGoogle();
        if (u) {
          localStorage.setItem('nailong_logged_in', '1');
          sessionStorage.removeItem('nailong_login_gate');
          location.href = sessionStorage.getItem('nailong_return_after_login') || 'index.html';
        }
      } catch (e) { showErr(e.message || 'Gagal login Google'); }
    };

    document.getElementById('btnLogin').onclick = async function () {
      showErr('');
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('pass').value;
      if (!email || !pass) return showErr('Isi email & password');
      try {
        var auth = ensureFb();
        var cred = await auth.signInWithEmailAndPassword(email, pass);
        if (cred && cred.user) {
          localStorage.setItem('nailong_logged_in', '1');
          sessionStorage.removeItem('nailong_login_gate');
          location.href = sessionStorage.getItem('nailong_return_after_login') || 'index.html';
        }
      } catch (e) {
        var msg = e.message || 'Login gagal';
        if (String(msg).indexOf('user-not-found') >= 0 || String(e.code||'').indexOf('user-not-found') >= 0)
          msg = 'Akun tidak ditemukan. Daftar dulu.';
        else if (String(e.code||'').indexOf('wrong-password') >= 0 || String(msg).indexOf('wrong-password') >= 0)
          msg = 'Password salah.';
        else if (String(e.code||'').indexOf('invalid-credential') >= 0)
          msg = 'Email atau password salah.';
        showErr(msg);
      }
    };

    // sudah login → home
    setTimeout(function () {
      try {
        if (firebase.apps.length && firebase.auth().currentUser) {
          localStorage.setItem('nailong_logged_in', '1');
          location.href = 'index.html';
        }
      } catch (e) {}
    }, 800);
  })();
  </script>
</body>
</html>
