<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daftar - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap { max-width: 400px; margin: 0 auto; padding: 24px 16px 100px; }
    .auth-card {
      background: rgba(16,24,42,0.75); border: 1px solid rgba(255,193,7,0.22);
      border-radius: 20px; padding: 28px 20px; text-align: center;
      backdrop-filter: blur(12px);
    }
    .auth-card img.logo { width: 96px; height: auto; margin: 0 auto 14px; display: block; }
    .auth-card h1 { font-size: 20px; color: #fff; margin: 0 0 6px; }
    .auth-card .sub { font-size: 13px; color: #8aa0b8; margin-bottom: 20px; }
    .auth-card label { display:block; text-align:left; font-size:12px; color:#cfd8dc; margin: 10px 0 4px; font-weight:600; }
    .auth-card .form-input { width:100%; }
    .btn-auth {
      width: 100%; margin-top: 14px; padding: 14px;
      background: linear-gradient(90deg,#FFC107,#FF8F00); color:#0a0e18;
      border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .btn-google {
      width: 100%; margin-top: 10px; padding: 13px;
      background: #fff; color: #1a1a1a; border: none; border-radius: 12px;
      font-weight: 700; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .auth-links { margin-top: 16px; font-size: 13px; color: #8aa0b8; }
    .auth-links a { color: #FFC107; font-weight: 700; text-decoration: none; }
    .divider { display:flex; align-items:center; gap:10px; margin: 16px 0; color:#6b7a90; font-size:11px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,193,7,0.2); }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nailong-digital-logo.png" alt="Nailong Digital" class="logo-full">
    </div></div>
  </header>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="nailong-digital-logo.png" alt="ND" class="logo">
      <h1>Daftar Akun</h1>
      <p class="sub">Buat akun Nailong Digital gratis.</p>
      <label>Nama</label>
      <input type="text" id="name" class="form-input" placeholder="Nama panggilan">
      <label>Email</label>
      <input type="email" id="email" class="form-input" placeholder="email@contoh.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="pass" class="form-input" placeholder="Min. 6 karakter" autocomplete="new-password">
      <button type="button" class="btn-auth" id="btnReg">Daftar</button>
      <div class="divider">atau</div>
      <button type="button" class="btn-google" id="btnGoogle"><i class="fa-brands fa-google" style="color:#ea4335"></i> Daftar dengan Google</button>
      <div class="auth-links">Sudah punya akun? <a href="login.html">Masuk</a></div>
      <div class="auth-links"><a href="index.html">← Kembali ke beranda</a></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script src="ui-enhance.js"></script>
  <script>
    document.getElementById('btnGoogle').onclick = async function () {
      if (!window.VoxyyAuth) return alert('Auth belum siap');
      try {
        var u = await VoxyyAuth.loginGoogle();
        if (u) {
          localStorage.setItem('nailong_logged_in', '1');
          location.href = 'index.html';
        }
      } catch (e) { alert(e.message || 'Gagal'); }
    };
    document.getElementById('btnReg').onclick = async function () {
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('pass').value;
      if (!email || !pass || pass.length < 6) return alert('Email & password min 6 karakter');
      try {
        var auth = firebase.auth();
        var cred = await auth.createUserWithEmailAndPassword(email, pass);
        if (cred.user && name) {
          await cred.user.updateProfile({ displayName: name });
        }
        localStorage.setItem('nailong_logged_in', '1');
        location.href = 'index.html';
      } catch (e) {
        alert(e.message || 'Gagal daftar');
      }
    };
  </script>
</body>
</html>
