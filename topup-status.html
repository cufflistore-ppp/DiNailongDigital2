<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="description" content="Nailong Digital — Botwa, Joki, Produk Digital & Jasweb. Order online, bayar QRIS atau saldo.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nailong Digital">
  <meta property="og:title" content="Nailong Digital | Botwa, Joki & Produk Digital">
  <meta property="og:description" content="Nailong Digital menyediakan Botwa, Joki, Produk Digital & Jasweb terpercaya. Order online, bayar QRIS atau saldo, cek riwayat pesanan.">
  <meta property="og:image" content="/og-banner.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nailong Digital">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nailong Digital">
  <meta name="twitter:description" content="Pusat layanan Nailong Digital. Order online, bayar QRIS atau saldo.">
  <meta name="twitter:image" content="/og-banner.jpg">
  <link rel="icon" href="nd-logo-gold.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="nd-logo-gold.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nd-logo-gold.jpg" alt="Nailong Digital" class="logo-full"></div></div>
  </header>
  <div class="page-content">
    <a href="topup.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali Top Up</a>
    <div class="saldo-card">
      <div class="saldo-left"><span class="saldo-label">Saldo Saat Ini</span><span class="saldo-amount" id="saldoAmount">Rp 0</span></div>
    </div>
    <h2 class="page-title"><i class="fa-solid fa-receipt"></i> Status Top Up</h2>
    <p class="page-desc">Riwayat top up via Wijaya Pay. Hanya milik Anda.</p>
    <div id="topupList" class="riwayat-list">
      <div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Belum ada top up.</p></div>
    </div>
  </div>
  <nav class="bottom-nav nav-5">
    <a href="botwa.html" class="nav-item" data-nav="botwa">
      <span class="nav-icon-wrap"><i class="fa-brands fa-whatsapp"></i></span>
      <span>Botwa</span>
    </a>
    <a href="joki.html" class="nav-item" data-nav="joki">
      <span class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></span>
      <span>Joki Kontak</span>
    </a>
    <a href="index.html" class="nav-item active" data-nav="home">
      <span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span>
      <span>Home</span>
    </a>
    <a href="jasweb.html" class="nav-item" data-nav="jasweb">
      <span class="nav-icon-wrap"><i class="fa-solid fa-globe"></i></span>
      <span>JasWeb</span>
    </a>
    <a href="akun.html" class="nav-item" data-nav="akun">
      <span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span>
      <span>Akun</span>
    </a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>
  <script src="balance.js"></script><script src="nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      if(window.NailongBalance) NailongBalance.refresh();
      try {
        var tx = JSON.parse(localStorage.getItem('nailong_balance_tx')||'[]').filter(function(t){ return (t.desc||'').indexOf('Top Up')>=0; });
        var list=document.getElementById('topupList');
        if(!tx.length) return;
        list.innerHTML = tx.slice().reverse().map(function(t){
          return '<div class="riwayat-item credit"><div class="riwayat-icon"><i class="fa-solid fa-wallet"></i></div><div class="riwayat-body"><div class="riwayat-title">'+(t.desc||'Top Up')+'</div><div class="riwayat-time">'+(t.time||'')+'</div></div><div class="riwayat-amount">+ Rp '+Math.abs(t.amount).toLocaleString('id-ID')+'</div></div>';
        }).join('');
      } catch(e){}
    });
  </script>

  <script src="chat-system.js"></script>
  <script src="presence.js"></script>
  <script src="wijayapay.js"></script>
  <script src="pay-choice.js"></script>

  <script src="ui-enhance.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
</body>
</html>
