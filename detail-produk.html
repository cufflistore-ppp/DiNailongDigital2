<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="description" content="Nailong Digital — Botwa, Joki, Produk Digital & Jasweb. Order online, bayar QRIS atau saldo.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nailong Digital">
  <meta property="og:title" content="Nailong Digital | Botwa, Joki & Produk Digital">
  <meta property="og:description" content="Nailong Digital menyediakan Botwa, Joki, Produk Digital & Jasweb terpercaya. Order online, bayar QRIS atau saldo, cek riwayat pesanan.">
  <meta property="og:image" content="/og-banner.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nailong Digital">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nailong Digital">
  <meta name="twitter:description" content="Pusat layanan Nailong Digital. Order online, bayar QRIS atau saldo.">
  <meta name="twitter:image" content="/og-banner.jpg">
  <link rel="icon" href="nd-logo-gold.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="nd-logo-gold.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    .produk-detail-img {
      width: 100%;
      aspect-ratio: 4 / 5;
      height: auto;
      max-height: none;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
      background: #1e2a45;
      margin-bottom: 14px;
      display: block;
    }
    .produk-detail-card {
      background: #12182a;
      border: 1px solid #1e2a45;
      border-radius: 14px;
      padding: 16px;
    }
    .produk-detail-card h2 {
      font-size: 20px;
      margin: 8px 0;
    }
    .produk-status {
      display: inline-block;
      background: #0d2137;
      color: #FFE082;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 6px;
    }
    .produk-harga-big {
      font-size: 26px;
      font-weight: 800;
      color: #FF6F00;
      margin: 12px 0;
    }
    .fitur-list {
      list-style: none;
      margin: 12px 0;
    }
    .fitur-list li {
      padding: 8px 0;
      border-bottom: 1px solid #1e2a45;
      font-size: 13px;
      color: #ccc;
    }
    .fitur-list li i {
      color: #FF6F00;
      margin-right: 8px;
    }
    .fitur-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered">
      <div class="logo-text-wrap">
        <img src="nd-logo-gold.jpg" alt="Nailong Digital" class="logo-full">
      </div>
    </div>
  </header>

  <div class="top-notif" id="topNotif" style="display:none;"></div>

  <div class="page-content">
    <a href="digital.html" class="back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Produk Digital</a>

    <div id="detailProduk">
      <p style="color:#aaa;text-align:center;">Memuat produk...</p>
    </div>
  </div>

  <a href="laporan.html" class="floating-laporan"><i class="fa-solid fa-exclamation-circle"></i> Laporan</a>

  <nav class="bottom-nav nav-5">
    <a href="botwa.html" class="nav-item" data-nav="botwa">
      <span class="nav-icon-wrap"><i class="fa-brands fa-whatsapp"></i></span>
      <span>Botwa</span>
    </a>
    <a href="joki.html" class="nav-item" data-nav="joki">
      <span class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></span>
      <span>Joki Kontak</span>
    </a>
    <a href="index.html" class="nav-item active" data-nav="home">
      <span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span>
      <span>Home</span>
    </a>
    <a href="jasweb.html" class="nav-item" data-nav="jasweb">
      <span class="nav-icon-wrap"><i class="fa-solid fa-globe"></i></span>
      <span>JasWeb</span>
    </a>
    <a href="akun.html" class="nav-item" data-nav="akun">
      <span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span>
      <span>Akun</span>
    </a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>

  <script src="digital-produk.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="account-widget.js"></script>
  <script>
    function loadDetailProduk() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id") || "1", 10);

      // reload dari storage (digital-produk.js sudah load)
      if (typeof loadProdukDigital === "function") loadProdukDigital();

      const item = (typeof produkDigital !== "undefined" ? produkDigital : []).find(p => p.id === id);
      const el = document.getElementById("detailProduk");

      if (!item) {
        el.innerHTML = "<p style='color:#aaa;'>Produk tidak ditemukan. <a href='digital.html' style='color:#FF6F00;'>Kembali</a></p>";
        return;
      }

      const harga = "Rp " + Number(item.harga).toLocaleString("id-ID");

      el.innerHTML = `
        <div class="order-header" style="margin-bottom:16px;">
          <img src="nd-logo-gold.jpg" class="order-logo" alt="Nailong">
          <div>
            <h3>${item.judul}</h3>
            <p>Nailong · <span class="tag">${item.status || "Digital"}</span> · <span class="tag aman">Aman</span></p>
          </div>
        </div>

        <div class="badge">PRODUK DIGITAL</div>
        <div class="produk-detail-card" style="margin-top:12px;">
          ${item.img ? `<img src="${item.img}" alt="${item.judul}" class="produk-detail-img" onerror="this.style.display=\'none\'">` : ""}
          <span class="produk-status">${item.status || "TERSEDIA"}</span>
          <h2>${item.judul}</h2>
          <p style="font-size:13px;color:#bbb;line-height:1.5;">${item.deskripsi || ""}</p>
          
          <div class="produk-harga-big">${harga}</div>

          <h4 style="font-size:14px;margin-top:8px;color:#FF6F00;">Yang kamu dapat:</h4>
          <ul class="fitur-list">
            ${(item.fitur || []).map(f => `<li> ${f}</li>`).join("")}
          </ul>

          <a href="pesan.html?type=produk&id=${item.id}" class="btn-pesan" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">
            Pesan Produk Ini
          </a>
        </div>

        <div class="info-box" style="margin-top:16px;">
          <h4>Bedanya dengan Joki?</h4>
          <p style="font-size:12px;color:#bbb;">
            <b>Produk Digital</b> = file / jasa sekali beli, dikirim setelah bayar.<br>
            <b>Joki Kontak</b> = layanan push kontak berdurasi (1 hari, 2 hari, dst).
          </p>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", loadDetailProduk);
  </script>

  <script src="chat-system.js"></script>
  <script src="presence.js"></script>
  <script src="wijayapay.js"></script>
  <script src="pay-choice.js"></script>

  <script src="ui-enhance.js"></script>
  <script src="nav.js"></script>
</body>
</html>
