<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Catalog - Nailong Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="nailong-digital-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .gc-search { display:flex; gap:8px; margin-bottom:12px; }
    .gc-search input { flex:1; }
    .gc-tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .gc-tabs button {
      border:1px solid rgba(255,193,7,0.25); background:rgba(16,24,42,0.6);
      color:#cfd8dc; border-radius:999px; padding:8px 12px; font-size:11px; font-weight:700; cursor:pointer;
    }
    .gc-tabs button.active { background:linear-gradient(90deg,#FFC107,#FF8F00); color:#0a0e18; border-color:transparent; }
    .gc-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .gc-card {
      background:#121a2b; border:2px solid #2a3548;
      border-radius:6px; padding:0; text-decoration:none; display:block; color:inherit;
      overflow:hidden; box-shadow: 3px 3px 0 #0a0e18;
    }
    .gc-card:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 #0a0e18; }
    .gc-art {
      height:88px; display:block; overflow:hidden;
      background:#0d1420; border-bottom:2px solid #2a3548;
    }
    .gc-art img {
      width:100%; height:100%; object-fit:cover; display:block;
      image-rendering: auto;
    }
    .gc-card .body { padding:10px; }
    .gc-card b { display:block; color:#fff; font-size:12px; margin-bottom:4px; font-family: ui-monospace, monospace; }
    .gc-card span { font-size:10px; color:#8aa0b8; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .gc-card .tag { display:inline-block; margin-top:8px; font-size:9px; font-weight:800; padding:3px 6px; border-radius:3px; font-family: ui-monospace, monospace; }
    .gc-card .tag.on { background:#1b3a2a; color:#69f0ae; border:1px solid #2e7d4f; }
    .gc-card .tag.off { background:#2a2410; color:#FFC107; border:1px solid #6b5a1a; }
    .gc-note { font-size:12px; color:#8aa0b8; margin-bottom:12px; line-height:1.45; }
    .gc-count { font-size:12px; color:#FFC107; margin-bottom:10px; font-weight:700; }
  </style>
</head>
<body>
  <header class="header header-logo-only">
    <div class="brand brand-centered"><div class="logo-text-wrap">
      <img src="nailong-digital-logo.png" alt="Nailong Digital" class="logo-full">
    </div></div>
  </header>
  <div class="page-content">
    <div class="badge">GAME CATALOG</div>
    <h2 class="page-title"><i class="fa-solid fa-gamepad"></i> Nailong Games</h2>
    <p class="gc-note">Setiap game buka di <b>halaman sendiri</b> (tidak dicampur). Yang bertanda <b style="color:#69f0ae">Main</b> langsung bisa dimainkan. Lainnya menampilkan cara main (siap dikembangkan).</p>
    <div class="gc-tabs">
      <button type="button" class="active" data-f="all">Semua</button>
      <button type="button" data-f="playable">Bisa main</button>
      <button type="button" data-f="catalog">Katalog</button>
    </div>
    <div class="gc-search">
      <input type="text" id="q" class="form-input" placeholder="Cari nama game...">
    </div>
    <div class="gc-count" id="cnt">—</div>
    <div class="gc-grid" id="grid"></div>
  </div>
  <nav class="bottom-nav nav-5">
    <a href="botwa.html" class="nav-item" data-nav="botwa"><span class="nav-icon-wrap"><i class="fa-brands fa-whatsapp"></i></span><span>Botwa</span></a>
    <a href="joki.html" class="nav-item" data-nav="joki"><span class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></span><span>Joki Kontak</span></a>
    <a href="index.html" class="nav-item" data-nav="home"><span class="nav-icon-wrap"><i class="fa-solid fa-house"></i></span><span>Home</span></a>
    <a href="music.html" class="nav-item" data-nav="music"><span class="nav-icon-wrap"><i class="fa-solid fa-music"></i></span><span>Music</span></a>
    <a href="akun.html" class="nav-item" data-nav="akun"><span class="nav-icon-wrap"><i class="fa-solid fa-user"></i></span><span>Akun</span></a>
    <div class="nav-indicator" id="navIndicator"></div>
  </nav>
  <script src="games-catalog.js"></script>
  <script src="games-covers.js"></script>
  <script src="header-bar.js"></script>
  <script src="nav.js"></script>
  <script src="ui-enhance.js"></script>
  <script src="protect.js"></script>
  <script>
  (function(){
    var all = window.NAILONG_GAMES_CATALOG || [];
    var filter = 'all';
    function render(){
      var q = (document.getElementById('q').value||'').toLowerCase().trim();
      var list = all.filter(function(g){
        if(filter==='playable' && !g.playable) return false;
        if(filter==='catalog' && g.playable) return false;
        if(q && (g.name||'').toLowerCase().indexOf(q)<0) return false;
        return true;
      });
      document.getElementById('cnt').textContent = list.length + ' game · ' + all.filter(function(x){return x.playable;}).length + ' bisa dimainkan';
      document.getElementById('grid').innerHTML = list.slice(0,120).map(function(g){
        var href = 'play.html?id=' + encodeURIComponent(g.key);
        var art = (window.NailongGameCovers && NailongGameCovers.coverFor(g.key, g.name)) || '';
        return '<a class="gc-card" href="'+href+'"><div class="gc-art"><img src="'+art+'" alt=""></div><div class="body"><b>'+g.name+'</b><span>'+(g.how||'')+'</span>'+
          '<span class="tag '+(g.playable?'on':'off')+'">'+(g.playable?'▶ MAIN':'📖 CARA')+'</span></div></a>';
      }).join('') + (list.length>120?'<p style="grid-column:1/-1;color:#8aa0b8;font-size:12px;">Menampilkan 120 pertama. Pakai pencarian.</p>':'');
    }
    document.querySelectorAll('.gc-tabs button').forEach(function(b){
      b.onclick=function(){
        document.querySelectorAll('.gc-tabs button').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active'); filter=b.getAttribute('data-f'); render();
      };
    });
    document.getElementById('q').oninput=render;
    render();
  })();
  </script>
</body>
</html>
