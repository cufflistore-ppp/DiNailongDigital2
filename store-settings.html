<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QRIS & Kontak Toko - Nailong Digital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<style>
.p{padding:14px;max-width:480px;margin:0 auto 110px}
.c{background:#FFF5E0;border:2.5px solid #111;box-shadow:6px 6px 0 #111;border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;font-weight:900;color:#111;margin:0 0 10px}
label{font-size:12px;font-weight:800;display:block;margin:8px 0 4px;color:#111}
input,textarea,select{width:100%;padding:10px;border:2.5px solid #111;border-radius:12px;box-shadow:3px 3px 0 #111;box-sizing:border-box;font-weight:600}
button.sv{width:100%;margin-top:12px;padding:12px;background:#FFD600;border:2.5px solid #111;box-shadow:4px 4px 0 #111;border-radius:12px;font-weight:900}
</style></head><body>
<header class="header header-logo-only"><div class="brand brand-centered"><div class="logo-text-wrap">
<img src="nd-logo-gold.jpg" class="logo-full" alt="ND"><div class="nd-brand-text">NAILONG<span>DIGITAL</span></div>
</div></div></header>
<div class="p"><div class="c"><h2>QRIS & Kontak Toko</h2><div id="body">Memuat...</div></div></div>
<nav class="bottom-nav nav-5"></nav>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="global-orders.js"></script><script src="auth.js"></script><script src="roles.js"></script>
<script src="nav.js"></script><script src="header-bar.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function() {
  var body = document.getElementById("body");
  var page = "store-settings.html";
  function waitUser() {
    return new Promise(function(res) {
      var u = firebase.auth().currentUser;
      if (u) return res(u);
      firebase.auth().onAuthStateChanged(function(x) { res(x); });
    });
  }
  if (page === "store-settings.html") {
    body.innerHTML = '<label>Nama toko</label><input id="sn"><label>URL foto toko</label><input id="sp"><label>URL banner</label><input id="sb"><label>URL foto QRIS</label><input id="sq"><label>Nomor WhatsApp</label><input id="swa"><label>Username Telegram</label><input id="stg"><label>Kontak aktif</label><select id="sc"><option value="wa">WhatsApp</option><option value="telegram">Telegram</option><option value="web">Chat website</option><option value="all">Semua</option></select><label>Link grup</label><input id="sg"><button type="button" class="sv" id="save">Simpan</button><p id="m" style="font-weight:800"></p>';
    var user = await waitUser();
    if (!user) { body.innerHTML = "<p style=font-weight:800>Login dulu</p>"; return; }
    var st = (await firebase.database().ref("nd_stores/"+user.uid).once("value")).val() || {};
    sn.value=st.name||""; sp.value=st.photo||""; sb.value=st.banner||""; sq.value=st.qris||"";
    swa.value=st.wa||""; stg.value=st.telegram||""; sc.value=st.contactMode||"wa"; sg.value=st.groupLink||"";
    save.onclick = async function() {
      await NDRoles.saveStore(user.uid, {name:sn.value, photo:sp.value, banner:sb.value, qris:sq.value, wa:swa.value, telegram:stg.value, contactMode:sc.value, groupLink:sg.value, enabled:true});
      m.textContent = "Tersimpan di Firebase (aman saat update website)";
    };
  } else if (page === "buyer-manen.html") {
    var snap = await firebase.database().ref("nd_buyer_manen").once("value");
    var t = (snap.val() && snap.val().text) || "Panduan Buyer Manen Nailong Digital.\n\nFounder bisa mengedit teks ini.";
    var user = await waitUser();
    var can = user && NDRoles.isFounder(user);
    if (can) {
      body.innerHTML = '<textarea id="tx" rows="12"></textarea><button type="button" class="sv" id="sv">Simpan (Founder)</button>';
      tx.value = t;
      sv.onclick = async function() {
        await firebase.database().ref("nd_buyer_manen").set({text: tx.value, updatedAt: Date.now()});
        alert("Tersimpan");
      };
    } else {
      body.innerHTML = '<div style="white-space:pre-wrap;font-weight:700;color:#111"></div>';
      body.firstChild.textContent = t;
    }
  } else if (page === "kontak-partner.html") {
    var snap = await firebase.database().ref("nd_users").once("value");
    var all = snap.val() || {};
    var rows = Object.keys(all).map(function(k){return all[k];}).filter(function(u){return u.role==="partner"||u.role==="paid_promote";});
    body.innerHTML = rows.length ? rows.map(function(u){
      return '<div style="border:2px solid #111;border-radius:12px;padding:10px;margin:8px 0;font-weight:700;background:#fff">'+(u.name||"-")+" · "+u.role+"<br>WA: "+((u.idents&&u.idents.noPribadi)||u.wa||"-")+" · "+(u.email||"")+"</div>";
    }).join("") : '<p style="font-weight:700">Belum ada partner / paid promote aktif</p>';
  }
});
</script></body></html>
